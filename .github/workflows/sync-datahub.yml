name: Sync Data Hub từ Pancake

# LỊCH CHẠY DO SUPABASE ĐIỀU PHỐI (từ 21/9/2026).
# GitHub Actions giãn cron dưới 1 giờ thành 2-5 tiếng, nên lịch đã chuyển sang pg_cron trên Supabase:
# pg_cron -> Edge Function 'sync-now' -> workflow_dispatch (loại kích này chạy NGAY, không bị giãn).
# Xem lịch hiện hành: bảng cron.job trên Supabase, hoặc mục "Lịch chạy tự động" trong app.
# Ở đây chỉ giữ workflow_dispatch để Supabase và người dùng bấm chạy được.
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Quét lại toàn bộ đơn từ 1/6/2026'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      # Chặn lỗi đọc thiếu dữ liệu: PostgREST trả tối đa 1000 dòng/lần, quên phân trang là âm thầm sai số.
      - name: Kiểm tra phân trang khi đọc Supabase
        run: node scripts/check-pagination.js
      - name: Sync đơn hàng Pancake -> Supabase
        env:
          PANCAKE_SESSION_TOKEN: ${{ secrets.PANCAKE_SESSION_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL: ${{ (github.event.schedule == '5 0 * * *' || inputs.backfill) && '1' || '0' }}
        run: node scripts/sync-datahub-pancake.js
