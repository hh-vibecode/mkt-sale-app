name: Sync Data Hub từ Pancake

on:
  schedule:
    # 30 phút/lần -- chạy INCREMENTAL (5 trang mới nhất/shop), nhẹ, đủ bắt đơn mới.
    - cron: '*/30 * * * *'
    # 7h05 sáng VN (00:05 UTC) -- lượt BACKFILL quét lại toàn bộ từ 1/6, bắt cả sửa đổi trên đơn cũ.
    # Lệch 5 phút khỏi giờ tròn vì GitHub Actions hay dồn/rớt cron đúng phút :00.
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Quét lại toàn bộ đơn từ 1/6/2026'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Sync đơn hàng Pancake -> Supabase
        env:
          PANCAKE_SESSION_TOKEN: ${{ secrets.PANCAKE_SESSION_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL: ${{ (github.event.schedule == '5 0 * * *' || inputs.backfill) && '1' || '0' }}
        run: node scripts/sync-datahub-pancake.js
