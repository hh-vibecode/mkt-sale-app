name: Sync Data Hub từ Pancake

on:
  schedule:
    - cron: '*/30 * * * *'   # mỗi 30 phút -- Data Hub là lead mới, Sale cần thấy sớm hơn MKT (chỉ 1 lần/ngày)
    # 3h10 sáng VN: backfill toàn bộ từ 1/6. Chạy thường chỉ quét 5 trang mới nhất/shop, KHÔNG thấy được sửa đổi
    # trên đơn cũ (Pancake không sắp lại theo ngày sửa) -- mà Sale ghi Mã KH vào Ghi chú nội bộ của cả đơn cũ.
    - cron: '10 20 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Quét lại toàn bộ đơn từ 1/6/2026'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Sync đơn hàng Pancake -> Supabase
        env:
          PANCAKE_SESSION_TOKEN: ${{ secrets.PANCAKE_SESSION_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL: ${{ (github.event.schedule == '10 20 * * *' || inputs.backfill) && '1' || '0' }}
        run: node scripts/sync-datahub-pancake.js
