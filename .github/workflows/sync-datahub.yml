name: Sync Data Hub từ Pancake

on:
  schedule:
    # 7h05 sáng VN (00:05 UTC) -- lượt chính. Lệch 5 phút vì GitHub hay dồn/rớt cron đúng đầu giờ.
    - cron: '5 0 * * *'
    # 8h05 sáng VN (01:05 UTC) -- lượt DỰ PHÒNG, chạy lại y hệt phòng khi lượt đầu lỗi.
    - cron: '5 1 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Quét lại toàn bộ đơn từ 1/6/2026'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Sync đơn hàng Pancake -> Supabase
        env:
          PANCAKE_SESSION_TOKEN: ${{ secrets.PANCAKE_SESSION_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL: '1'   # chỉ chạy 2 lượt/ngày nên luôn quét lại toàn bộ từ 1/6, không dùng chế độ 5 trang mới nhất
        run: node scripts/sync-datahub-pancake.js
