name: Sync hoá đơn KiotViet

on:
  schedule:
    # 3 lượt/ngày giờ VN: 7h05 sáng · 12h05 trưa · 15h05 chiều.
    # Lệch 5 phút khỏi giờ tròn vì GitHub Actions hay dồn/rớt cron đúng phút :00.
    - cron: '5 0 * * *'
    - cron: '5 5 * * *'
    - cron: '5 8 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Quét lại toàn bộ hoá đơn từ 1/6/2026'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Sync hoá đơn KiotViet -> Supabase
        env:
          KIOT_CLIENT_ID: ${{ secrets.KIOT_CLIENT_ID }}
          KIOT_CLIENT_SECRET: ${{ secrets.KIOT_CLIENT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL: '1'   # chỉ chạy 2 lượt/ngày nên luôn quét lại toàn bộ từ 1/6, không dùng chế độ 5 trang mới nhất
        run: node scripts/sync-kiot-invoices.js
