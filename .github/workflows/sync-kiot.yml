name: Sync KiotViet (đơn đặt hàng + hoá đơn)

# LỊCH CHẠY DO SUPABASE ĐIỀU PHỐI (từ 21/9/2026).
# GitHub Actions giãn cron dưới 1 giờ thành 2-5 tiếng, nên lịch đã chuyển sang pg_cron trên Supabase:
# pg_cron -> Edge Function 'sync-now' -> workflow_dispatch (loại kích này chạy NGAY, không bị giãn).
# Xem lịch hiện hành: bảng cron.job trên Supabase, hoặc mục "Lịch chạy tự động" trong app.
# Ở đây chỉ giữ workflow_dispatch để Supabase và người dùng bấm chạy được.
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Quét lại toàn bộ hoá đơn từ 1/6/2026'
        type: boolean
        default: false

# KHÔNG cho 2 lượt chạy chồng (13/10/2026): job tự tạo (data nhập tay, Chốt đơn Sỉ, đơn Pancake từ hội thoại) đọc "chưa có" rồi mới tạo
# -> 2 lượt cùng lúc là tạo TRÙNG. Lượt mới xếp hàng chờ lượt đang chạy xong (không huỷ lượt đang chạy).
concurrency:
  group: sync-kiot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      # LƯỢT QUÉT LẠI TOÀN BỘ + SO KHỚP (11/11/2026): trước đây do pg_cron gọi riêng goi_sync('kiot', true) lúc 00:20 UTC -- TRÙNG PHÚT với lượt
      # 15 phút nên Edge Function sync-now từ chối 1 trong 2 ("Job đang chạy rồi") -> 11/11 mất lượt 07:20. Nay KHÔNG gọi riêng nữa: lượt 15 phút
      # nào chạy trong khung 7h hoặc 22h giờ VN mà 3 tiếng qua CHƯA có lượt so khớp (bảng kiot_so_khop) thì tự làm lượt toàn bộ; lỡ lượt này thì
      # lượt 15 phút kế tiếp trong giờ làm thay. Bấm chạy tay có tick backfill thì luôn là lượt toàn bộ.
      - name: Xác định lượt (quét lại toàn bộ + so khớp?)
        id: luot
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TAY: ${{ inputs.backfill && '1' || '0' }}
        run: |
          GIO=$(TZ=Asia/Ho_Chi_Minh date +%H)
          DAY=0
          if [ "$TAY" = "1" ]; then DAY=1
          elif [ "$GIO" = "07" ] || [ "$GIO" = "22" ]; then
            TU=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)
            N=$(curl -s "https://bcrpxfvvjsjpvbksqzls.supabase.co/rest/v1/kiot_so_khop?select=id&chay_luc=gte.$TU&limit=1&offset=0" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | grep -c '"id"' || true)
            [ "$N" = "0" ] && DAY=1
          fi
          echo "day_du=$DAY" >> "$GITHUB_OUTPUT"
          echo "Giờ VN $GIO -> lượt quét lại toàn bộ + so khớp: $DAY"
      - name: Sync hoá đơn KiotViet -> Supabase
        env:
          KIOT_CLIENT_ID: ${{ secrets.KIOT_CLIENT_ID }}
          KIOT_CLIENT_SECRET: ${{ secrets.KIOT_CLIENT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL: ${{ steps.luot.outputs.day_du }}
        run: node scripts/sync-kiot-invoices.js
      # Đơn đặt hàng = nguồn doanh số + ngày chốt của báo cáo Sale (hoá đơn phía trên chỉ để đối soát).
      # 30/10/2026: lượt 15 phút chỉ lấy đơn VỪA SỬA (lastModifiedFrom 3 giờ); lượt toàn bộ (lượt 15 phút đầu khung 7h + 22h VN, 11/11) quét lại TOÀN BỘ.
      # Hoá đơn: lượt 15 phút lấy hoá đơn + khách vừa sửa 6 giờ; backfill = hoá đơn tháng hiện tại + toàn bộ khách, Chủ nhật toàn bộ hoá đơn.
      # 10/11/2026: TRƯỚC ĐÂY bước này KHÔNG nhận BACKFILL -> từ 31/10 không lượt nào quét lại toàn bộ đơn đặt hàng (chỉ đơn sửa 3 giờ) ->
      # đơn Kiot xoá / phiếu hiện lại với ngày sửa cũ không bao giờ về app (DH001689.03.02, DH002643...). Giờ lượt backfill quét toàn bộ.
      - name: Sync đơn đặt hàng KiotViet -> Supabase
        if: always()
        env:
          KIOT_CLIENT_ID: ${{ secrets.KIOT_CLIENT_ID }}
          KIOT_CLIENT_SECRET: ${{ secrets.KIOT_CLIENT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL: ${{ steps.luot.outputs.day_du }}
        run: node scripts/sync-kiot-orders.js

      # SO KHỚP KIOT ↔ APP (anh Hải 10/11/2026: "ngày 2 lần sáng tối check cho t xong report vô đó"): chỉ lượt toàn bộ = lượt 15 phút đầu
      # tiên khung 7h + 22h VN (bước 'Xác định lượt'). So từng mã, tự kéo bù / đánh dấu Kiot đã xoá, ghi bảng kiot_so_khop
      # -> Cài đặt nâng cao > So khớp Kiot. Chạy NGAY sau 2 bước kéo để các bước tự tạo phía dưới dùng dữ liệu đã sửa.
      - name: So khớp Kiot ↔ app (tự sửa)
        if: always() && steps.luot.outputs.day_du == '1'
        env:
          KIOT_CLIENT_ID: ${{ secrets.KIOT_CLIENT_ID }}
          KIOT_CLIENT_SECRET: ${{ secrets.KIOT_CLIENT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/so-khop-kiot.js

      # Danh mục hàng (nhóm cha) cho thẻ "Doanh số theo nhóm hàng" ở Báo cáo tổng hợp (30/10/2026) -- chỉ lượt quét lại toàn bộ (khung 7h + 22h VN).
      - name: Sync danh mục hàng KiotViet (nhóm cha)
        if: always() && steps.luot.outputs.day_du == '1'
        env:
          KIOT_CLIENT_ID: ${{ secrets.KIOT_CLIENT_ID }}
          KIOT_CLIENT_SECRET: ${{ secrets.KIOT_CLIENT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-kiot-hang.js

      # Sau khi có đơn mới: tự tạo dòng Data nhập tay cho khách LẺ mua qua kênh ONLINE từ 1/6/2026
      # mà app chưa có, để doanh thu về đúng báo cáo Sale/MKT mà Sale không phải gõ tay.
      - name: Tự tạo data nhập tay từ đơn Kiot
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/tu-tao-nhap-tay.js

      # Đơn đặt hàng Sỉ đủ điều kiện (có dấu vết tiền) -> tự có 1 dòng "Chốt đơn" trong Lịch sử chăm sóc,
      # ngày = ngày tạo phiếu. Đồng thời gắn mã đơn cho dòng chốt cũ nhập từ sheet (anh Hải 25/9/2026).
      # Khách ĐÃ CHỐT chưa có Mã KH: SĐT khớp đúng 1 khách Kiot, mã chưa thuộc ai, khách có đơn từ lúc nhắn -> tự gắn mã
      # (ghi trong app, không sửa Pancake). Ca không chắc để lại Daily Task cho Sale (anh Hải 12/10/2026).
      - name: Tự gắn Mã KH cho khách đã chốt
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/tu-gan-ma-kh.js

      - name: Tự tạo dòng Chốt đơn Sỉ trong lịch sử chăm sóc
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/tu-tao-chot-don-si.js

      # Sản phẩm quan tâm của khách Sỉ (Đồ thờ / Nến / Hỗn hợp): đã mua -> xem phiếu, chưa mua -> quảng cáo /
      # page / hội thoại Pancake. Sale chọn tay thì không ghi đè (anh Hải 28/9/2026).
      - name: Phân loại sản phẩm quan tâm khách Sỉ
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PANCAKE_SESSION_TOKEN: ${{ secrets.PANCAKE_SESSION_TOKEN }}
        run: node scripts/phan-loai-sp-quan-tam.js
