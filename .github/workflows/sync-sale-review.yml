name: Crawl Pancake + chấm tự động phần không cần AI

on:
  schedule:
    # 01:12 UTC = 08:12 giờ Việt Nam (UTC+7) mỗi ngày. Lệch phút khỏi giờ tròn (xem giải thích ở
    # sync-mkt.yml) — cũng lệch với job sync-mkt (08:07) để 2 job không tranh runner cùng lúc.
    - cron: '12 1 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: 'Từ ngày (YYYY-MM-DD) — để trống = hôm qua'
        required: false
      to:
        description: 'Đến ngày (YYYY-MM-DD) — để trống = hôm qua'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crawl hội thoại Pancake
        env:
          PANCAKE_SESSION_TOKEN: ${{ secrets.PANCAKE_SESSION_TOKEN }}
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
        run: node scripts/crawl-pancake.js

      - name: Tách lượt hỏi - đáp
        env:
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
        run: python3 scripts/extract-sale-pairs.py

      - name: Đẩy lên Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/push-sale-review.py
