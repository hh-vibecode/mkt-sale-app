name: Crawl Pancake + chấm tự động phần không cần AI

on:
  schedule:
    # 3 lượt/ngày giờ VN: 7h05 sáng · 12h05 trưa · 15h05 chiều.
    # Lệch 5 phút khỏi giờ tròn vì GitHub Actions hay dồn/rớt cron đúng phút :00.
    - cron: '5 0 * * *'
    - cron: '5 5 * * *'
    - cron: '5 8 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: 'Từ ngày (YYYY-MM-DD) — để trống = hôm qua'
        required: false
      to:
        description: 'Đến ngày (YYYY-MM-DD) — để trống = hôm qua'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crawl hội thoại Pancake
        env:
          PANCAKE_SESSION_TOKEN: ${{ secrets.PANCAKE_SESSION_TOKEN }}
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
        run: node scripts/crawl-pancake.js

      - name: Tách lượt hỏi - đáp
        env:
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
        run: python3 scripts/extract-sale-pairs.py

      - name: Đẩy lên Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/push-sale-review.py
