name: Sync MKT report from Meta Ads

on:
  schedule:
    # 7h05 sáng VN (00:05 UTC) lượt chính · 8h05 VN (01:05 UTC) lượt dự phòng. Lệch 5 phút vì GitHub hay rớt cron đầu giờ.
    - cron: '5 0 * * *'
    - cron: '5 1 * * *'
  workflow_dispatch: {} # cho phép bấm chạy tay từ tab Actions trên GitHub, tiện để test/chạy bù

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync hôm qua
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-mkt-from-meta.js
