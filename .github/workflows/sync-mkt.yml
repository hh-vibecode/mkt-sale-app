name: Sync MKT report from Meta Ads

on:
  schedule:
    # 01:07 UTC = 08:07 giờ Việt Nam (UTC+7) mỗi ngày. Lệch phút khỏi giờ tròn vì GitHub Actions hay
    # bị dồn/rớt cron đúng đầu giờ (đã tái diễn 2 lần trong 2 ngày 4/9, 5/9 ở đúng phút :00 UTC).
    - cron: '7 1 * * *'
  workflow_dispatch: {} # cho phép bấm chạy tay từ tab Actions trên GitHub, tiện để test/chạy bù

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync hôm qua
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-mkt-from-meta.js
