name: Đối soát Kiot (hằng đêm)

# ĐỐI SOÁT HẰNG ĐÊM: 23:00 giờ VN (= 16:00 UTC) MỌI NGÀY (anh Hải 16/10/2026: "không cập nhật cuối ngày định kỳ à"; trước: chỉ Chủ nhật,
# chốt 08/10). Lịch GitHub hay trễ 1-4 tiếng (lượt 11/10 hẹn 23:00 chạy 03:03 sáng). source sync_log GIỮ tên 'Đối soát Kiot (tuần)' vì app đọc tên đó.
# 1) kéo lại TOÀN BỘ hoá đơn từ 1/1/2026 + đơn đặt hàng  2) so từng mã Kiot API vs CSDL app -> ghi sync_log
#    (source 'Đối soát Kiot (tuần)'), tab Data Hub > Đối soát hiện kết quả. Không tự xoá gì.
on:
  schedule:
    - cron: '0 16 * * *'   # 23:00 VN hằng ngày
  workflow_dispatch:

jobs:
  doi-soat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Kéo lại toàn bộ hoá đơn Kiot từ 1/1/2026
        env:
          KIOT_CLIENT_ID: ${{ secrets.KIOT_CLIENT_ID }}
          KIOT_CLIENT_SECRET: ${{ secrets.KIOT_CLIENT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL: '1'
        run: node scripts/sync-kiot-invoices.js
      - name: Kéo lại đơn đặt hàng Kiot
        if: always()
        env:
          KIOT_CLIENT_ID: ${{ secrets.KIOT_CLIENT_ID }}
          KIOT_CLIENT_SECRET: ${{ secrets.KIOT_CLIENT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-kiot-orders.js
      - name: So từng mã Kiot ↔ app
        if: always()
        env:
          KIOT_CLIENT_ID: ${{ secrets.KIOT_CLIENT_ID }}
          KIOT_CLIENT_SECRET: ${{ secrets.KIOT_CLIENT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/doi-soat-kiot.js
