name: Kiểm số khi sửa code

# ĐỔI CÁCH KIỂM (2/10/2026, anh Hải: "chốt mốc số liệu hay lỗi lắm"):
# Trước: 3 lần / ngày so số hiện tại với mốc 8 tiếng trước -> đơn mới, ads mới về cũng làm số nhảy (đầu tháng +100%),
# báo động giả gần như mỗi ngày, lại sinh commit "Chot moc so lieu tu dong" hay gây xung đột git.
# Nay: CHỈ chạy khi có người đẩy bản sửa index.html. Lấy code CŨ (trước lần đẩy) và code MỚI chạy trên CÙNG MỘT bộ dữ liệu
# -> lệch nào cũng là do chính bản sửa code. Lệch > 5% thì FAIL (có mail) để kiểm lại.
# Đổi số CÓ CHỦ ĐÍCH: ghi lý do vào VIEC.md và để chữ [doi-so] trong nội dung commit -> bỏ qua bước so.
on:
  push:
    branches: [main]
    paths: ['index.html']
  workflow_dispatch: {}        # bấm chạy tay: so bản hiện tại với bản ngay trước

permissions:
  contents: read

jobs:
  kiem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: So code cũ với code mới trên cùng dữ liệu
        if: ${{ !contains(github.event.head_commit.message, '[doi-so]') }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRUOC: ${{ github.event.before }}
        run: |
          CU="$TRUOC"
          if [ -z "$CU" ] || [ "$CU" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$CU" 2>/dev/null; then CU=HEAD~1; fi
          git show "$CU:index.html" > /tmp/index-cu.html
          node scripts/kiem-so-lieu.js --so-code /tmp/index-cu.html
